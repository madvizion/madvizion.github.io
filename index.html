<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M A D V I Z I O N</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #e0e0e0;
            --accent-color: #ff3333;
            --highlight-color: #00ffcc;
            --font-mono: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: crosshair;
        }

        body {
            /* 1. Set a dark color in case image loads slow */
            background-color: #050505;
            
            /* 2. BACKGROUND IMAGE SETTINGS */
            background-image: url('bckg.png');
            background-position: center center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-size: cover; 
            
            color: var(--text-color);
            font-family: var(--font-mono);
            min-height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- OVERLAYS --- */
        .scanlines {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.1) 50%, rgba(0,0,0,0.1));
            background-size: 100% 4px; pointer-events: none; z-index: 100;
            opacity: 0.6;
        }
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 99;
        }

        /* --- SOCIAL ICONS --- */
        .social-sidebar {
            position: fixed; top: 25px; right: 25px;
            display: flex; gap: 15px; z-index: 200;
        }
        .social-sidebar a {
            color: var(--text-color); opacity: 0.6; transition: 0.3s;
        }
        .social-sidebar a:hover {
            opacity: 1; color: var(--accent-color); transform: scale(1.1);
        }
        .social-icon { width: 22px; height: 22px; fill: currentColor; }

        /* --- MAIN CONTAINER --- */
        .container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 550px;
            height: 85vh;
            max-height: 750px;
            padding: 40px;
            border: 1px solid #333;
            /* 0.85 Opacity ensures background is visible through the box */
            background: rgba(5, 5, 5, 0.85);
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- HEADER --- */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
            width: 100%;
        }

        .logo-img {
            display: block;
            max-width: 100%;
            width: 280px; 
            height: auto;
            margin: 0 auto 15px auto;
        }

        .member-display {
            font-size: 0.9rem; color: var(--accent-color);
            letter-spacing: 3px; min-height: 1.2em;
            font-weight: bold;
        }

        /* --- MENUS --- */
        .content-window {
            flex-grow: 1;
            width: 100%;
            overflow-y: auto;
            padding: 10px 5px;
            margin-bottom: 20px;
            scrollbar-width: thin;
            scrollbar-color: #333 transparent;
        }
        .content-window::-webkit-scrollbar { width: 3px; }
        .content-window::-webkit-scrollbar-thumb { background: #444; }

        .hidden { display: none !important; }

        /* --- BUTTONS --- */
        .btn-menu {
            display: block; width: 100%;
            background: transparent;
            color: var(--text-color);
            border: 1px solid #444;
            padding: 20px;
            margin-bottom: 15px;
            font-family: var(--font-mono);
            font-size: 1rem;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 3px;
            transition: all 0.3s;
        }
        .btn-menu:hover {
            background: var(--text-color); color: #000; border-color: var(--text-color);
        }

        .btn-back {
            background: transparent; border: none; color: #666;
            padding: 10px; cursor: pointer; font-family: var(--font-mono);
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px;
        }
        .btn-back:hover { color: var(--text-color); }

        /* --- LIST ITEMS --- */
        .list-group { margin-bottom: 30px; }
        .group-header {
            color: var(--highlight-color);
            margin-bottom: 15px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        .track-item {
            display: block;
            text-decoration: none;
            color: var(--text-color);
            padding: 12px 5px;
            border-bottom: 1px solid #1a1a1a;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .track-item:hover {
            padding-left: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            border-bottom-color: #444;
        }
        
        .t-date { color: var(--accent-color); font-weight: bold; margin-right: 10px; opacity: 0.9; }
        .t-title { font-weight: bold; text-transform: uppercase; }
        .t-artist { color: #888; font-size: 0.75rem; margin-top: 4px; display: inline-block;}
        .t-tag { float: right; color: #555; font-size: 0.7rem; margin-top: 4px; }

        /* --- FOOTER --- */
        .footer-info {
            font-size: 0.7rem; color: #333; text-align: center; margin-top: auto; letter-spacing: 2px;
        }

        @media (max-width: 600px) {
            .t-tag { float: none; display: block; margin-top: 2px; }
            .container { height: 95vh; width: 95%; padding: 25px; }
            .logo-img { width: 220px; }
            body { background-attachment: scroll; }
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="noise"></div>
